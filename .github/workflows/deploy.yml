name: Build, test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # `contents: write` so the deploy job can push the built site to gh-pages.
  contents: write

concurrency:
  # NOT "pages": an abandoned re-run is stuck holding that group in a state
  # GitHub will not let us cancel, which silently prevents new runs from even
  # being created.
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Silent data drift must fail CI, not the UI.
      - name: Codegen is reproducible
        run: |
          pnpm run gen
          git diff --exit-code -- src/generated

      - run: pnpm run typecheck

      - run: pnpm run lint

      # Includes the catalogue invariants, the -203 floor property test, and
      # the node:sqlite Qry_Summary oracle diff.
      - name: Unit, property and oracle tests
        run: pnpm run test

      - run: pnpm run build

      # Privacy/compliance tests that read the BUILT output (38, 43, T).
      - name: Re-run tests against dist/
        run: pnpm vitest run tests/privacy.test.ts

      # E2E runs against the BUILT output served from a repository subpath,
      # which is where the GitHub Pages failure mode lives (gotcha P).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test

      # Publish by pushing dist/ to the gh-pages branch, which Pages serves via
      # its legacy branch build.
      #
      # WHY NOT actions/deploy-pages: on this repo that action reliably stalls in
      # `deployment_queued` past its timeout and the run fails, even though the
      # site itself builds fine. A branch push completes in ~20s. The tradeoff is
      # that `base: './'` in vite.config.ts is doing the work an absolute base
      # would otherwise do — relative asset URLs are what make this path safe.
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/main'
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
